<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📒 elsruse.org</title>

    <style>
        /* Regular */
        @font-face {
            font-family: 'Ysabeau Infant';
            src: url('/assets/fonts/YsabeauInfant-Medium.woff2') format('woff2');
            font-weight: 400;
        }

        /* Bold */
        @font-face {
            font-family: 'Ysabeau Infant';
            src: url('/assets/fonts/YsabeauInfant-Medium.woff2') format('woff2');
            font-weight: 700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Ysabeau Infant', sans-serif;
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url('/assets/img/els-geo-milev-ruse.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.7s ease;
        }

        @keyframes subtlePulse {
            0% {
                opacity: 0.55;
            }

            35% {
                opacity: 0.75;
            }

            50% {
                opacity: 0.60;
            }

            70% {
                opacity: 0.85;
            }

            85% {
                opacity: 0.65;
            }

            100% {
                opacity: 0.55;
            }
        }

        .animated-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            pointer-events: none;
            z-index: 10;
            animation: subtlePulse 6s ease-in-out infinite;
        }

        .content-container {
            position: relative;
            z-index: 20;
            padding: 3rem 1.5rem;
            max-width: 32rem;
            width: 100%;
            text-align: center;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-card {
            background: rgba(3, 3, 3, 0.533);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 45px;
            padding: 7rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: border-color 0.5s ease;
        }

        .glass-card:hover {
            border-color: #e4ed6b;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: #d1d5db;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .ping-dot {
            position: relative;
            display: flex;
            width: 0.5rem;
            height: 0.5rem;
        }

        .ping-dot::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #34d399;
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
            opacity: 0.75;
        }

        .ping-dot::after {
            content: '';
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #34d399;
        }

        @keyframes ping {

            75%,
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .title {
            font-size: 2.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin-bottom: 1rem;
            line-height: 1.25;
        }

        .description {
            color: #d1d5db;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.625;
            margin-bottom: 2rem;
        }

        .btn-primary {
            padding: 0.875rem;
            border-radius: 3rem;
            background-color: #ffdd38;
            color: #000000;
            font-weight: 600;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background-color: #000000;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .footer-note {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 1.5rem;
            font-weight: 300;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <div class="bg-image"></div>

    <div class="animated-overlay"></div>

    <main class="content-container">
        <div class="glass-card">
            <div class="badge">
                <span class="ping-dot"></span>
                СКОРО<br>SOON
                <span class="ping-dot"></span>
            </div>

            <h1 class="title">
                📒<br>elsruse.org
            </h1>

            <p class="description">Винаги сред първите!<br>Always among the first!
            </p>

            <button class="btn-primary" id="midiBtn" onclick="toggleMIDI()">
                🥁
            </button>
        </div>

        <p class="footer-note">
            kitkazdravets.eu<br>
            2026
        </p>
    </main>

    <script>
        let isPlaying = false;
        const midiFile = new Audio('yellow-submarine.mp3');

        function toggleMIDI() {
            const btn = document.getElementById('midiBtn');
            if (!isPlaying) {
                midiFile.currentTime = 0;
                midiFile.play().catch(error => {
                    console.log('Аудиото не можа да се възпроизведе:', error);
                });
                btn.innerText = '🎶';
                isPlaying = true;
            } else {
                midiFile.pause();
                btn.innerText = '🥁';
                isPlaying = false;
            }
        }
    </script>

</body>

</html>
