<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「 ✦ виктория МАШЕВА 𖦹 victoria MASHEVA ✦ 」</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="description" content="">
  <meta property="og:title" content="「 ✦ виктория МАШЕВА 𖦹 victoria MASHEVA ✦ 」">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://elsruse.org/graduating-class/2003/A/VictoriaMasheva/favicon.png">
  <meta property=" og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="「 ✦ виктория МАШЕВА 𖦹 victoria MASHEVA ✦ 」">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://elsruse.org/graduating-class/2003/A/VictoriaMasheva/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #000;
      color: #fff;
    }

    a:link {
      color: #00bcd4;
    }

    a:visited {
      color: #ff80ab;
    }

    .emoji-monochrome {
      filter: grayscale(100%);
    }

    .checkerboard-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-image:
        linear-gradient(45deg, #111 25%, transparent 25%),
        linear-gradient(-45deg, #111 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #111 75%),
        linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 60px 60px;
      background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
      background-color: #050505;
      animation: moveCheckerboard 20s linear infinite;
    }

    .vignette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: radial-gradient(circle 600px at var(--mouse-x, 50%) var(--mouse-y, 50%),
          rgba(255, 255, 255, 0.08) 0%,
          rgba(0, 0, 0, 0.85) 80%);
      pointer-events: none;
    }

    @keyframes moveCheckerboard {
      0% {
        background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
      }

      100% {
        background-position: 600px 600px, 600px 630px, 630px 570px, 570px 600px;
      }
    }

    .hero-container {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
    }

    .glass-card {
      width: 92%;
      max-width: 950px;
      background: rgba(18, 18, 18, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(255, 255, 255, 0.03);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(255, 255, 255, 0.05);
    }

    .img-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .responsive-img {
      width: 100%;
      height: auto;
      max-height: 55vh;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .glass-card:hover .responsive-img {
      transform: scale(1.02);
    }

    .caption-text {
      margin-top: 1.8rem;
      color: #e0e0e0;
      font-size: 1.25rem;
      line-height: 1.6;
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.5px;
      max-width: 800px;
    }

    @media (max-width: 600px) {
      .glass-card {
        padding: 1.25rem;
        width: 95%;
      }

      .caption-text {
        font-size: 1rem;
        margin-top: 1.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="checkerboard-bg"></div>
  <div class="vignette-overlay"></div>

  <main class="hero-container">

    <article class="glass-card">
      <div class="img-wrapper">
        <img src="vmsh.webp" alt="виктория МАШЕВА | victoria MASHEVA" class="responsive-img">
      </div>
      <p class="caption-text"><a href="https://vmsh.xyz/ViKiTo"><b>2002</b></a> 「 <span style="color:#673ab7;">✦</span>
        виктория МАШЕВА
      <p style="color:#1a237e;">𖦹</p> victoria MASHEVA
      <span style="color:#673ab7;">✦</span> &nbsp;」 <a href="https://vmsh.xyz" target="_blank"><b>2026</b></a></p>
    </article>

  </main>
  <script>
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--mouse-x', x + '%');
      document.documentElement.style.setProperty('--mouse-y', y + '%');
    });
  </script>
</body>

</html>
